[package]
name = "panopticon-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=50.0.1", features = ["p1"] }

[profile.release]
strip = true
opt-level = "s"
